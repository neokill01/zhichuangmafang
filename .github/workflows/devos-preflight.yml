name: DevOS server preflight
on:
  push:
    branches: [chore/devos-server-preflight]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}
      - name: Check existing server resources without modifying services
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -T 10 -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=15 "ubuntu@$SERVER_HOST" 'python3 -' <<'PY'
          import json,os,platform,shutil,socket,subprocess,glob
          def probe(args):
            try:
              r=subprocess.run(args,capture_output=True,text=True,timeout=10)
              return r.stdout.strip() if r.returncode==0 else None
            except Exception:return None
          memory={}
          with open('/proc/meminfo') as f:
            for line in f:
              if line.startswith(('MemTotal:','MemAvailable:')):memory[line.split(':')[0]]=int(line.split()[1])//1024
          sock=socket.socket();sock.settimeout(1)
          occupied=sock.connect_ex(('127.0.0.1',3001))==0;sock.close()
          report={'os':platform.system(),'architecture':platform.machine(),'cpuCount':os.cpu_count(),'loadAverage':os.getloadavg(),'memoryMiB':memory,'diskFreeGiB':round(shutil.disk_usage('/var/lib').free/(1024**3),2),'nodeVersion':probe(['node','--version']),'glibc':platform.libc_ver(),'systemdAvailable':shutil.which('systemctl') is not None,'port3001Occupied':occupied,'serviceExists':probe(['systemctl','show','agentic-devos.service','--property=LoadState','--value'])=='loaded','sudoNoninteractive':subprocess.run(['sudo','-n','true'],capture_output=True).returncode==0}
          report['privateServiceActive']=probe(['systemctl','show','agentic-devos.service','--property=ActiveState','--value'])
          report['uploadedArchiveBytes']=max([os.path.getsize(p) for p in glob.glob('/tmp/agentic-devos-*.tgz')]+[0])
          report['releaseDirectories']=len(glob.glob('/opt/agentic-devos/releases/*'))
          report['websiteServiceActive']=probe(['systemctl','show','nginx.service','--property=ActiveState','--value'])
          print(json.dumps(report))
          PY
