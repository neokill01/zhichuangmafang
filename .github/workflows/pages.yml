name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 仅改动项目说明/配置类文件时不触发部署（只有全部改动都命中忽略规则才跳过）
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
      - '.claude/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
