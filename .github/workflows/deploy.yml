name: Deploy to Tencent Server

on:
  push:
    branches: [main]
    # 仅改动项目说明/配置类文件时不触发部署（只有全部改动都命中忽略规则才跳过）
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
      - '.claude/**'
      - '.github/**'
      # .deploy/ 已经被 .gitignore 忽略，正常不会出现在 diff 里；这条是防御性保留
      - '.deploy/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rsync
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rsync
          rsync --version | head -1

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Trust server host
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Sync website files to /var/www/site
        run: |
          # 仅部署官网页面：先构建一个临时目录，只放 index.html/favicon.svg/css/js，
          # 再用「单目录 + --delete」同步，保证远端与站点内容严格一致，
          # 并清理多余文件（营销/素材文件不会进入站点）。
          rm -rf .deploy-stage
          mkdir -p .deploy-stage
          cp index.html favicon.svg .deploy-stage/
          cp -r css js images .deploy-stage/
          rsync -az --delete .deploy-stage/ ubuntu@${{ secrets.SERVER_HOST }}:/var/www/site/

      - name: Reload nginx
        run: ssh ubuntu@${{ secrets.SERVER_HOST }} 'sudo systemctl reload nginx'
