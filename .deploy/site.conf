# 智创码坊 · 官网静态站点
server {
    server_name www.zcmfopc.com zcmfopc.com;

    root /var/www/site;
    index index.html;

    # 静态资源：允许直接访问，未命中返回 404
    location / {
        try_files $uri $uri/ =404;
    }

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # 静态资源缓存
    location ~* \.(?:css|js|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zcmfopc.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zcmfopc.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.zcmfopc.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = zcmfopc.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.zcmfopc.com zcmfopc.com;
    return 404; # managed by Certbot




}